name: Build Frontend and Update GitOps

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: aims/frontend
  FRONTEND_CONTEXT: .
  INFRA_REPOSITORY: SK-Rookies-AIMS/infra
  INFRA_MANIFEST_PATH: k8s/frontend/kustomization.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-scanning-configuration scanOnPush=true --image-tag-mutability MUTABLE

      - name: Build and push Docker image
        id: build-image
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          BRANCH_IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_REF_NAME}"

          docker build -t "$IMAGE_URI" -t "$BRANCH_IMAGE_URI" "$FRONTEND_CONTEXT"
          docker push "$IMAGE_URI"
          docker push "$BRANCH_IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          fetch-depth: 0

      - name: Update image tag in infra repository
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          MANIFEST="infra/${INFRA_MANIFEST_PATH}"

          IMAGE_TAG="${IMAGE_URI##*:}"

          sed -i -E \
            "s|^([[:space:]]*)newTag:.*$|\1newTag: ${IMAGE_TAG}|" \
            "$MANIFEST"

          grep -n "newTag:" "$MANIFEST"

          cd infra

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$INFRA_MANIFEST_PATH"

          if git diff --cached --quiet; then
            echo "Image tag is already up to date"
            exit 0
          fi

          git commit -m "chore(frontend): deploy ${GITHUB_REF_NAME}-${GITHUB_SHA::12}"

          for ATTEMPT in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"

            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            sleep $((ATTEMPT * 5))
          done

          echo "Failed to push GitOps image update"
          exit 1